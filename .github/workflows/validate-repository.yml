name: Validate OperationsFlow Toolkit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Repository and evidence validation
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate PBIX files, data, evidence, and public boundary
        shell: pwsh
        run: .\tools\verify-repository.ps1 -SkipGitCleanCheck

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: operationsflow-toolkit-validation
          path: artifacts/validation
          if-no-files-found: error
